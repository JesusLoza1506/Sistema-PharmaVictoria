name: CD · PharmaVictoria Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Probar y empaquetar versión portátil
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-package: jdk+fx
          java-version: '21'
          cache: maven
      - name: Verificar y generar el JAR
        run: mvn --batch-mode --no-transfer-progress -Pportable-ci clean verify
      - name: Crear ZIP portátil con JavaFX
        shell: pwsh
        run: ./scripts/build-portable.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: PharmaVictoria-Windows-x64
          path: target/PharmaVictoria-Windows-x64.zip
          if-no-files-found: error

  publish:
    name: Publicar en GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: windows
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: PharmaVictoria-Windows-x64
          path: release
      - name: Publicar ZIP para la etiqueta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/PharmaVictoria-Windows-x64.zip --clobber
          else
            gh release create "$RELEASE_TAG" release/PharmaVictoria-Windows-x64.zip --verify-tag --generate-notes
          fi
